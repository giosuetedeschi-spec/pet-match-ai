services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: petmatch_web
      MYSQL_USER: petmatch
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-petmatch-local}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init/01-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  ml:
    build:
      context: ./services/ml
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ML_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mail:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"

  django:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    environment:
      DEBUG: "True"
      SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-change-before-deploy}
      ALLOWED_HOSTS: localhost,127.0.0.1,django
      DB_ENGINE: mysql
      DB_NAME: petmatch_mvp
      DB_USER: petmatch
      DB_PASSWORD: ${MYSQL_PASSWORD:-petmatch-local}
      DB_HOST: mysql
      DB_PORT: "3306"
      EMAIL_HOST: mail
      EMAIL_PORT: "1025"
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py import_comuni_istat &&
        python manage.py seed_data &&
        gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application
    depends_on:
      mysql:
        condition: service_healthy
      mail:
        condition: service_started
    ports:
      - "127.0.0.1:${DJANGO_PORT:-8000}:8000"
    volumes:
      - django_media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/geo/comuni/?q=Torino')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  streamlit:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      PET_MATCH_API_URL: http://django:8000
    depends_on:
      django:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"

  web:
    build:
      context: ./apps/web
      dockerfile: Containerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://petmatch:${MYSQL_PASSWORD:-petmatch-local}@mysql:3306/petmatch_web
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(async r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

volumes:
  mysql_data:
  django_media:
