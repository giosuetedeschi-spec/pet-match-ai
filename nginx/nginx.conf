# File di Configurazione Nginx (/etc/nginx/sites-available/app.conf)

server {
    listen 80;
    server_name tua-dominio.it www.tua-dominio.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tua-dominio.it www.tua-dominio.it;

    ssl_certificate /etc/letsencrypt/live/tua-dominio.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tua-dominio.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline';" always;

    # File Statici gestiti direttamente da Nginx per la massima velocità
    location /static/ {
        alias /var/www/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Upload Media Protetti
    location /media/ {
        alias /var/www/app/media/;
        internal; # Accessibile solo previa autorizzazione Django
    }

    # Proxy verso l'applicazione Containerizzata
    location / {
        proxy_pass [http://127.0.0.1:8000](http://127.0.0.1:8000);
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}