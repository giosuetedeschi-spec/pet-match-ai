name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phase1:
    name: Phase 1 Django and Streamlit checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q apps config manage.py streamlit_app.py

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Test Phase 1 authentication and shelter APIs
        run: >-
          python manage.py test
          apps.users.tests.test_auth_api
          apps.core.tests.test_shelter_api
          --verbosity 2

      - name: Prepare isolated SQLite database
        run: python manage.py migrate --noinput

      - name: Smoke test comune distance API
        run: |
          python manage.py shell <<'PY'
          from datetime import date
          from rest_framework.test import APIClient
          from apps.core.models import Animal, AnimalStatus, Comune, Species
          from apps.users.models import User, ShelterProfile

          origin = Comune.objects.create(
              istat_code="999921", name="Origine", province_code="999",
              province="Provincia", province_abbreviation="OR", region="Test",
              latitude=45.0, longitude=7.0,
          )
          nearby = Comune.objects.create(
              istat_code="999922", name="Vicino", province_code="999",
              province="Provincia", province_abbreviation="OR", region="Test",
              latitude=45.25, longitude=7.0,
          )
          outside = Comune.objects.create(
              istat_code="999923", name="Lontano", province_code="999",
              province="Provincia", province_abbreviation="OR", region="Test",
              latitude=46.0, longitude=7.0,
          )

          def publishable_animal(username, comune, name):
              user = User.objects.create_user(
                  username=username, password="ci-only-password", role=User.Role.SHELTER,
                  comune=comune, city=comune.name, province=comune.province_abbreviation,
              )
              shelter = ShelterProfile.objects.create(
                  user=user, shelter_name=f"Rifugio {name}",
                  tax_code_vat=f"CI-{username}", official_email=f"{username}@example.test",
                  is_verified=True, verification_status=ShelterProfile.VerificationStatus.APPROVED,
              )
              return Animal.objects.create(
                  shelter=shelter, name=name, species=Species.DOG, gender="F",
                  date_entry_shelter=date.today(), status=AnimalStatus.AVAILABLE,
              )

          publishable_animal("ci-near", nearby, "Animale vicino")
          publishable_animal("ci-far", outside, "Animale lontano")
          client = APIClient()
          client.defaults["HTTP_HOST"] = "localhost"
          response = client.get(
              "/catalog/animals/", {"comune": origin.istat_code, "radius_km": 50},
          )
          assert response.status_code == 200, response.content
          results = response.data["results"]
          assert [animal["name"] for animal in results] == ["Animale vicino"], results
          assert 27.0 < results[0]["distance_km"] < 29.0, results[0]
          assert results[0]["latitude"] == 45.25, results[0]
          print("PASS: 50 km filter, Haversine distance, ordering and map coordinates")
          PY

      - name: Import reference data and seed MVP catalog
        run: |
          python manage.py import_comuni_istat
          python manage.py seed_data

      - name: Smoke test Streamlit against the running API
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload >/tmp/petmatch-django.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/geo/comuni/?q=Torino >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/petmatch-django.log
            exit 1
          fi
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("streamlit_app.py", default_timeout=30).run()
          if app.exception:
              raise AssertionError("; ".join(item.message for item in app.exception))
          print(f"PASS: rendered with {len(app.get('selectbox'))} selectboxes and no exceptions")
          PY

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
